<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game 2: Catch in Basket</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .top-bar { display: flex; justify-content: space-between; width: 90%; max-width: 600px; margin-bottom: 10px; align-items: center; }
        .hearts { font-size: 24px; color: #ef4444; }
        #score { font-size: 24px; font-weight: bold; color: #10b981; background: white; padding: 5px 15px; border-radius: 15px; border: 2px solid #10b981;}
        
        .word-container { background: white; padding: 10px 20px; border-radius: 20px; border: 4px solid #3b82f6; display: flex; align-items: center; gap: 15px; pointer-events: auto; color: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        h1 { margin: 0; font-size: 28px; }
        .speaker { font-size: 30px; cursor: pointer; background: #3b82f6; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: 0.2s; color: white; }
        .speaker:active { transform: scale(0.9); }

        .message-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255,255,255,0.95); border: 4px solid #3b82f6; padding: 40px; border-radius: 30px;
            text-align: center; color: #1e293b; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; width: 80%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .message-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 24px; border-radius: 20px; background: #3b82f6; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>

        </div>
    </div>

    </div>

        words.forEach(w => {
            loadedImages[w] = new Image();
            loadedImages[w].src = b64Assets[w];
        });

        let targetWord = "";
        let player = { x: canvas.width/2, y: canvas.height - 150, w: 120, h: 120, targetX: canvas.width/2 };
        let items = [];
        let particles = [];
        let spawnTimer = 0;

        function speakWord() {
            if(!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(targetWord);
            utterance.lang = 'en-US'; utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        let audioCtx = null;
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'catch') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function updatePlayer(x) {
            let newX = x - player.w/2;
            if(newX < 0) newX = 0;
            if(newX > canvas.width - player.w) newX = canvas.width - player.w;
            player.targetX = newX;
        }

        window.addEventListener("mousemove", (e) => updatePlayer(e.clientX));
        window.addEventListener("touchmove", (e) => { e.preventDefault(); updatePlayer(e.touches[0].clientX); }, {passive: false});

        function spawnItem() {
            // 40% chance for correct item, 60% for random wrong
            let isCorrect = Math.random() < 0.4;
            let wordSpawn = targetWord;
            if(!isCorrect) {
                let wrongs = words.filter(w => w !== targetWord);
                wordSpawn = wrongs[Math.floor(Math.random() * wrongs.length)];
            }
            items.push({
                word: wordSpawn,
                x: Math.random() * (canvas.width - 80) + 40,
                y: -100,
                r: 40, // visual radius
                speed: Math.random() * 1.5 + 2 // Medium speed, no crazy acceleration
            });
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<25; i++) {
                particles.push({x:x, y:y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:30, color:color});
            }
        }

        function pickNewTarget() {
            let newTarget = words[Math.floor(Math.random() * words.length)];
            // prevent repeating the exact same word
            if(newTarget === targetWord && words.length > 1) { pickNewTarget(); return; }
            targetWord = newTarget;
            document.getElementById("targetWord").innerText = targetWord;
            speakWord();
        }

        function updateUI() {
            document.getElementById("score").innerText = "Score: " + score;
            let h = "";
            for(let i=0; i<lives; i++) h += "❤️";
            for(let i=lives; i<3; i++) h += "🖤";
            document.getElementById("heartsDisplay").innerText = h;
        }

        function loseLife() {
            lives--; playSound('wrong'); updateUI();
            if(lives <= 0) {
                isPlaying = false;
                document.getElementById("startScreen").classList.add("show");
                document.getElementById("startScreen").innerHTML = "<h2>Game Over</h2><p>Your Score: "+score+"</p><button onclick='location.reload()'>Restart</button>";
            }
        }

        window.startGame = function() {
            document.getElementById("startScreen").classList.remove("show");
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            score = 0; lives = 3; items = [];
            isPlaying = true;
            pickNewTarget();
            updateUI();
            requestAnimationFrame(loop);
        }

        function loop() {
            if(!isPlaying) return;
            
            // Lerp Player Movement (Smoothness)
            player.x += (player.targetX - player.x) * 0.15; // 0.15 is the smoothing factor

            // Background
            if(bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            // Player Basket
            player.y = canvas.height - player.h - 20;
            if(basketImg.complete) {
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(basketImg, player.x, player.y, player.w, player.h);
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.fillStyle = "#8B4513"; ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            // Spawn items
            spawnTimer++;
            if(spawnTimer > 80) { // Medium spawn rate
                spawnItem();
                spawnTimer = 0;
            }

            // Draw and update items
            for(let i=items.length-1; i>=0; i--) {
                let it = items[i];
                it.y += it.speed;
                
                // Draw item image
                let img = loadedImages[it.word];
                if(img && img.complete) {
                    ctx.save();
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2); ctx.clip();
                    ctx.drawImage(img, it.x - it.r, it.y - it.r, it.r*2, it.r*2);
                    ctx.restore();
                    // Optional border
                    ctx.strokeStyle = "white"; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2); ctx.stroke();
                } else {
                    ctx.fillStyle = "white";
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2); ctx.fill();
                }
                
                // Collision with basket
                if(it.y + it.r > player.y && it.y < player.y + player.h) {
                    if(it.x > player.x && it.x < player.x + player.w) {
                        if(it.word === targetWord) {
                            playSound('catch'); createExplosion(it.x, it.y, "#10b981");
                            score += 10; updateUI();
                            pickNewTarget(); // Change target IMMEDIATELY upon catch
                        } else {
                            createExplosion(it.x, it.y, "#ef4444");
                            loseLife();
                        }
                        items.splice(i, 1);
                        continue;
                    }
                }

                // Missed target
                if(it.y > canvas.height + 100) {
                    if(it.word === targetWord) loseLife(); // Punish for missing correct item
                    items.splice(i, 1);
                }
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
                if(p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
