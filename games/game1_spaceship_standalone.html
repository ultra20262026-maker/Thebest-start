<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game 1: Spaceship Phonics</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .top-bar { display: flex; justify-content: space-between; width: 90%; max-width: 600px; margin-bottom: 10px; align-items: center; }
        .hearts { font-size: 24px; color: #ef4444; }
        #score { font-size: 24px; font-weight: bold; color: #10b981; }
        
        .word-container { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; border: 2px solid #3b82f6; display: flex; align-items: center; gap: 15px; pointer-events: auto; }
        h1 { margin: 0; font-size: 28px; text-shadow: 2px 2px 5px black; }
        .speaker { font-size: 30px; cursor: pointer; background: #3b82f6; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .speaker:active { transform: scale(0.9); }

        .message-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(0,0,0,0.9); border: 4px solid white; padding: 40px; border-radius: 30px;
            text-align: center; color: white; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; width: 80%; max-width: 400px;
        }
        .message-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 24px; border-radius: 20px; background: #3b82f6; color: white; border: none; cursor: pointer; width: 100%; }
    
        /* Mobile Portrait & Landscape Scaling */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem !important; }
            .word-container { padding: 5px 10px !important; gap: 8px !important; }
            .speaker { width: 40px !important; height: 40px !important; font-size: 20px !important; }
            .hearts, #score { font-size: 18px !important; }
            #clueImg { width: 50px !important; height: 50px !important; }
            .message-overlay { padding: 20px !important; width: 90% !important; }
            button { font-size: 18px !important; padding: 10px 20px !important; }
        }
        @media (max-height: 600px) and (orientation: landscape) {
            body { overflow-y: auto !important; }
            canvas { height: 100vh !important; }
            #ui { 
                flex-direction: row !important; 
                justify-content: space-evenly !important; 
                top: 2px !important; 
                padding: 0 10px !important;
            }
            .top-bar { width: auto !important; margin-bottom: 0 !important; gap: 15px !important; }
            .word-container { padding: 2px 10px !important; gap: 5px !important; }
            h1 { font-size: 1.2rem !important; }
            .speaker { width: 30px !important; height: 30px !important; font-size: 16px !important; }
            #clueImg { width: 30px !important; height: 30px !important; }
            .message-overlay { padding: 15px !important; transform: translate(-50%, -50%) scale(0.8) !important; }
            .message-overlay.show { transform: translate(-50%, -50%) scale(1) !important; }
            h2 { font-size: 1.5rem !important; margin: 5px 0 !important; }
            p { font-size: 0.9rem !important; margin: 5px 0 !important; }
            button { font-size: 16px !important; padding: 5px 15px !important; margin-top: 5px !important; }
        }

    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
            <div id="score">Score: 0</div>
        </div>
        <div class="word-container">
            <div class="speaker" onclick="speakWord()">🔊</div>
            <h1 id="taskTitle">Build: <span id="targetWord" style="color:#fcd34d"></span></h1>
            <img id="clueImg" style="width: 80px; height: 80px; border-radius: 15px; margin-left: 15px; border: 2px solid white;">
        </div>
    </div>
    
    <div id="startScreen" class="message-overlay show">
        <h2>Spaceship 🚀</h2>
        <p>You have 3 Hearts. Listen to the word, and shoot the letters in order!</p>
        <button onclick="startGame()">Play</button>
    </div>

    <canvas id="gameCanvas"></canvas>

        ];
        
        let currentLevel = 0;
        let currentLetterIdx = 0;
        
        let player = { x: canvas.width/2, y: canvas.height - 120, w: 100, h: 100 };
        let bullets = [];
        let targets = [];
        let particles = [];
        let stars = [];

        // Initialize Stars for background
        for(let i=0; i<100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 0.5
            });
        }

        // Speech Synthesis
        function speakWord() {
            if(!window.speechSynthesis) return;
            const word = levels[currentLevel].word;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.8; // slightly slower for kids
            window.speechSynthesis.speak(utterance);
        }

        // Audio
        let audioCtx = null;
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'shoot') {
                osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'hit') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Controls
        function updatePlayer(x) {
            player.x = x - player.w/2;
            if(player.x < 0) player.x = 0;
            if(player.x > canvas.width - player.w) player.x = canvas.width - player.w;
        }

        window.addEventListener("mousemove", (e) => updatePlayer(e.clientX));
        window.addEventListener("touchmove", (e) => { e.preventDefault(); updatePlayer(e.touches[0].clientX); }, {passive: false});

        function fire() {
            if(!isPlaying) return;
            playSound('shoot');
            bullets.push({x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 15});
        }
        window.addEventListener("mousedown", (e) => { if(!e.target.closest('#ui')) fire(); });
        window.addEventListener("touchstart", (e) => { if(!e.target.closest('#ui')) fire(); }, {passive: false});

        function spawnTargets() {
            targets = [];
            let word = levels[currentLevel].word;
            let letters = word.split('');
            letters.push("a","x"); // dummy letters
            letters.sort(() => Math.random() - 0.5);
            let spacing = canvas.width / letters.length;
            letters.forEach((l, i) => {
                targets.push({ 
                    text: l, 
                    x: (i * spacing) + (spacing/2), 
                    y: -50 - (Math.random()*100), 
                    r: 25, 
                    speed: Math.random() * 1 + 0.5 
                });
            });
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<25; i++) {
                particles.push({x:x, y:y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:30, color:color});
            }
        }

        function updateUI() {
            let target = levels[currentLevel].word;
            let display = "";
            for(let i=0; i<target.length; i++) {
                if(i < currentLetterIdx) display += target[i] + " ";
                else display += "_ ";
            }
            document.getElementById("targetWord").innerText = display;
            document.getElementById("clueImg").src = levels[currentLevel].image;
            document.getElementById("score").innerText = "Score: " + score;
            
            let h = "";
            for(let i=0; i<lives; i++) h += "❤️";
            for(let i=lives; i<3; i++) h += "🖤";
            document.getElementById("heartsDisplay").innerText = h;
        }

        function loseLife() {
            lives--;
            playSound('wrong');
            updateUI();
            if(lives <= 0) {
                isPlaying = false;
                document.getElementById("startScreen").classList.add("show");
                document.getElementById("startScreen").innerHTML = "<h2>Game Over</h2><p>Try again!</p><button onclick='location.reload()'>Restart</button>";
            }
        }

        window.startGame = function() { window.gameStarted = true; resize();
            document.getElementById("startScreen").classList.remove("show");
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            score = 0; lives = 3; currentLevel = 0; currentLetterIdx = 0;
            isPlaying = true;
            spawnTargets();
            updateUI();
            speakWord(); // Speak automatically on start
            requestAnimationFrame(loop);
        }

        function nextLevel() {
            currentLevel++;
            currentLetterIdx = 0;
            if(currentLevel >= levels.length) {
                isPlaying = false;
                document.getElementById("startScreen").classList.add("show");
                document.getElementById("startScreen").innerHTML = "<h2>You Won! 🎉</h2><p>Amazing Phonics Skills!</p><button onclick='location.reload()'>Play Again</button>";
            } else {
                spawnTargets();
                updateUI();
                setTimeout(speakWord, 500); // speak next word
            }
        }

        function loop() {
            if(!isPlaying) return;
            
            // Draw Dark Starry Background
            ctx.fillStyle = "#020617"; // Very dark blue/black
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "white";
            stars.forEach(s => {
                s.y += s.speed;
                if(s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
            });

            // Draw player (spaceship with screen blend mode)
            player.y = canvas.height - player.h - 20; // Keep at bottom
            if(shipImg.complete) {
                ctx.globalCompositeOperation = 'screen';
                ctx.drawImage(shipImg, player.x, player.y, player.w, player.h);
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.fillStyle = "white"; ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            // Draw and update bullets
            ctx.fillStyle = "#06b6d4";
            for(let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i];
                b.y -= 10;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                
                // Collision
                for(let j=targets.length-1; j>=0; j--) {
                    let t = targets[j];
                    let dist = Math.hypot(b.x + b.w/2 - t.x, b.y - t.y);
                    if(dist < t.r + 10) {
                        if(t.text === levels[currentLevel].word[currentLetterIdx]) {
                            // Hit Correct
                            playSound('hit');
                            createExplosion(t.x, t.y, "#10b981");
                            score += 10;
                            currentLetterIdx++;
                            targets.splice(j, 1);
                            bullets.splice(i, 1);
                            updateUI();
                            if(currentLetterIdx === levels[currentLevel].word.length) {
                                setTimeout(nextLevel, 1000);
                            }
                            break;
                        } else {
                            // Hit wrong
                            createExplosion(t.x, t.y, "#ef4444");
                            targets.splice(j, 1);
                            bullets.splice(i, 1);
                            loseLife();
                            break;
                        }
                    }
                }
                if(b && b.y < 0) bullets.splice(i, 1);
            }

            // Draw targets
            for(let i=targets.length-1; i>=0; i--) {
                let t = targets[i];
                t.y += t.speed;
                
                // Draw asteroid circle
                ctx.fillStyle = "#334155";
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
                
                // Draw letter
                ctx.fillStyle = "white";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(t.text, t.x, t.y);
                
                // If target passes bottom, loop it back
                if(t.y > canvas.height + 50) t.y = -50;
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
                if(p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
