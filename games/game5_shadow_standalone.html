<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game 5: Shadow Match</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #8B4513; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .top-bar { display: flex; justify-content: space-between; width: 90%; max-width: 600px; margin-bottom: 10px; align-items: center; }
        .hearts { font-size: 24px; color: #ef4444; }
        #score { font-size: 24px; font-weight: bold; color: #d97706; background: white; padding: 5px 15px; border-radius: 15px; border: 2px solid #d97706;}
        
        .word-container { background: white; padding: 10px 20px; border-radius: 20px; border: 4px solid #d97706; display: flex; align-items: center; gap: 15px; pointer-events: auto; color: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        h1 { margin: 0; font-size: 28px; }
        .speaker { font-size: 30px; cursor: pointer; background: #d97706; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: 0.2s; color: white; }
        .speaker:active { transform: scale(0.9); }

        .message-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255,255,255,0.95); border: 4px solid #d97706; padding: 40px; border-radius: 30px;
            text-align: center; color: #1e293b; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; width: 80%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .message-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 24px; border-radius: 20px; background: #d97706; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
            <div id="score">Score: 0</div>
        </div>
        <div class="word-container">
            <div class="speaker" onclick="speakWord()">🔊</div>
            <h1 id="taskTitle">Match: <span id="targetWord" style="color:#d97706"></span></h1>
        </div>
    </div>
    
    <div id="startScreen" class="message-overlay show">
        <h2>Shadow Match 🕵️</h2>
        <p>You have 3 Hearts. Drag the correct picture to its shadow on the desk!</p>
        <button onclick="startGame()">Play</button>
    </div>

        words.forEach(w => {
            loadedImages[w] = new Image();
            loadedImages[w].src = b64Assets[w];
        });

        let targetWord = "";
        let options = []; // The draggable images
        let shadowBox = { x: 0, y: 0, w: 200, h: 200 };
        let draggedItem = null;
        let particles = [];
        
        function speakWord() {
            if(!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(targetWord);
            utterance.lang = 'en-US'; utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        let audioCtx = null;
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'win') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<30; i++) {
                particles.push({x:x, y:y, vx:(Math.random()-0.5)*12, vy:(Math.random()-0.5)*12, life:30, color:color});
            }
        }

        function setupRound() {
            let nextTarget = words[Math.floor(Math.random() * words.length)];
            if(nextTarget === targetWord && words.length > 1) { setupRound(); return; }
            targetWord = nextTarget;
            document.getElementById("targetWord").innerText = targetWord;
            
            // Set shadow in center
            shadowBox.x = canvas.width/2 - shadowBox.w/2;
            shadowBox.y = canvas.height/2 - shadowBox.h/2 - 50;

            // Generate 3 options (1 correct, 2 wrong)
            let wrongWords = words.filter(w => w !== targetWord);
            wrongWords.sort(() => 0.5 - Math.random());
            let roundWords = [targetWord, wrongWords[0], wrongWords[1]];
            roundWords.sort(() => 0.5 - Math.random()); // shuffle

            let startX = canvas.width/2 - 150; // spacing them at bottom
            let spacing = 150;

            options = [];
            for(let i=0; i<3; i++) {
                options.push({
                    word: roundWords[i],
                    x: startX + (i-1)*spacing - 60, // center it
                    y: canvas.height - 180,
                    w: 120, h: 120,
                    originalX: startX + (i-1)*spacing - 60,
                    originalY: canvas.height - 180,
                    isDragging: false
                });
            }
            speakWord();
        }

        function updateUI() {
            document.getElementById("score").innerText = "Score: " + score;
            let h = "";
            for(let i=0; i<lives; i++) h += "❤️";
            for(let i=lives; i<3; i++) h += "🖤";
            document.getElementById("heartsDisplay").innerText = h;
        }

        function loseLife() {
            lives--; playSound('wrong'); updateUI();
            if(lives <= 0) {
                isPlaying = false;
                document.getElementById("startScreen").classList.add("show");
                document.getElementById("startScreen").innerHTML = "<h2>Game Over</h2><p>Your Score: "+score+"</p><button onclick='location.reload()'>Restart</button>";
            }
        }

        // Drag and Drop Handlers
        function getPointerPos(e) {
            let rect = canvas.getBoundingClientRect();
            if(e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function onPointerDown(e) {
            if(!isPlaying) return;
            let pos = getPointerPos(e);
            // Check if we hit an option
            for(let i=options.length-1; i>=0; i--) {
                let opt = options[i];
                if(pos.x > opt.x && pos.x < opt.x + opt.w && pos.y > opt.y && pos.y < opt.y + opt.h) {
                    draggedItem = opt;
                    opt.isDragging = true;
                    // Bring to front
                    options.splice(i, 1);
                    options.push(opt);
                    break;
                }
            }
        }

        function onPointerMove(e) {
            if(draggedItem) {
                let pos = getPointerPos(e);
                draggedItem.x = pos.x - draggedItem.w/2;
                draggedItem.y = pos.y - draggedItem.h/2;
            }
        }

        function onPointerUp(e) {
            if(draggedItem) {
                // Check if dropped on shadow
                let centerX = draggedItem.x + draggedItem.w/2;
                let centerY = draggedItem.y + draggedItem.h/2;
                
                if(centerX > shadowBox.x && centerX < shadowBox.x + shadowBox.w && 
                   centerY > shadowBox.y && centerY < shadowBox.y + shadowBox.h) {
                    // Dropped in target area
                    if(draggedItem.word === targetWord) {
                        // Correct!
                        playSound('win');
                        createExplosion(shadowBox.x + shadowBox.w/2, shadowBox.y + shadowBox.h/2, "#f59e0b");
                        score += 10; updateUI();
                        setTimeout(setupRound, 500); // slight delay before next round
                    } else {
                        // Wrong!
                        playSound('wrong');
                        createExplosion(shadowBox.x + shadowBox.w/2, shadowBox.y + shadowBox.h/2, "#ef4444");
                        loseLife();
                        // Snap back
                        draggedItem.x = draggedItem.originalX;
                        draggedItem.y = draggedItem.originalY;
                    }
                } else {
                    // Snap back
                    draggedItem.x = draggedItem.originalX;
                    draggedItem.y = draggedItem.originalY;
                }
                draggedItem.isDragging = false;
                draggedItem = null;
            }
        }

        window.addEventListener("mousedown", onPointerDown);
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);
        window.addEventListener("touchstart", (e) => { if(e.target === canvas) { e.preventDefault(); onPointerDown(e); } }, {passive: false});
        window.addEventListener("touchmove", (e) => { if(e.target === canvas) { e.preventDefault(); onPointerMove(e); } }, {passive: false});
        window.addEventListener("touchend", (e) => { if(e.target === canvas) { e.preventDefault(); onPointerUp(e); } }, {passive: false});

        window.startGame = function() {
            document.getElementById("startScreen").classList.remove("show");
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            score = 0; lives = 3; 
            isPlaying = true;
            setupRound();
            updateUI();
            requestAnimationFrame(loop);
        }

        function loop() {
            if(!isPlaying) return;
            
            // Background
            if(bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#8B4513"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            // Draw Shadow Area (Target)
            let shadowImg = loadedImages[targetWord];
            if(shadowImg && shadowImg.complete) {
                ctx.save();
                ctx.filter = "brightness(0%)"; // Magic trick: turn image purely black
                ctx.globalAlpha = 0.5; // Make it look like a shadow
                // Draw rounded clip just in case, but real image acts as its own shape if transparent. 
                // Since our assets are JPGs, they are square. So the shadow will be a black square. Let's make it a nice rounded rect silhouette.
                ctx.beginPath(); ctx.roundRect(shadowBox.x, shadowBox.y, shadowBox.w, shadowBox.h, 20); ctx.fill();
                ctx.clip();
                ctx.drawImage(shadowImg, shadowBox.x, shadowBox.y, shadowBox.w, shadowBox.h);
                ctx.restore();
                
                // Add a glowing dashed border to indicate where to drop
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 4;
                ctx.setLineDash([15, 15]);
                ctx.beginPath(); ctx.roundRect(shadowBox.x - 10, shadowBox.y - 10, shadowBox.w + 20, shadowBox.h + 20, 20); ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Options (Draggable Items)
            // Draw a shelf for them
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.fillRect(0, canvas.height - 200, canvas.width, 200);

            for(let opt of options) {
                let img = loadedImages[opt.word];
                if(img && img.complete) {
                    ctx.save();
                    if(opt.isDragging) {
                        ctx.shadowColor = "rgba(0,0,0,0.5)";
                        ctx.shadowBlur = 20;
                        ctx.scale(1.1, 1.1);
                        ctx.translate(opt.x - opt.x*0.1, opt.y - opt.y*0.1);
                    } else {
                        ctx.translate(opt.x, opt.y);
                    }
                    
                    // Add white border/polaroid effect to options
                    ctx.fillStyle = "white";
                    ctx.fillRect(-10, -10, opt.w + 20, opt.h + 20);
                    ctx.drawImage(img, 0, 0, opt.w, opt.h);
                    
                    ctx.restore();
                }
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 30;
                ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0;
                if(p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
