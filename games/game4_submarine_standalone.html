<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game 4: Submarine Spelling</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0284c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .top-bar { display: flex; justify-content: space-between; width: 90%; max-width: 600px; margin-bottom: 10px; align-items: center; }
        .hearts { font-size: 24px; color: #ef4444; }
        #score { font-size: 24px; font-weight: bold; color: #0369a1; background: white; padding: 5px 15px; border-radius: 15px; border: 2px solid #0369a1;}
        
        .word-container { background: white; padding: 10px 20px; border-radius: 20px; border: 4px solid #0369a1; display: flex; align-items: center; gap: 15px; pointer-events: auto; color: #1e293b; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        h1 { margin: 0; font-size: 32px; letter-spacing: 5px; font-family: monospace; }
        .speaker { font-size: 30px; cursor: pointer; background: #0ea5e9; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; transition: 0.2s; color: white; }
        .speaker:active { transform: scale(0.9); }
        #clueImg { width: 60px; height: 60px; border-radius: 10px; border: 2px solid #0ea5e9; }

        .message-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255,255,255,0.95); border: 4px solid #0ea5e9; padding: 40px; border-radius: 30px;
            text-align: center; color: #1e293b; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100; width: 80%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .message-overlay.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 24px; border-radius: 20px; background: #0ea5e9; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; }
    
        /* Mobile Portrait & Landscape Scaling */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem !important; }
            .word-container { padding: 5px 10px !important; gap: 8px !important; }
            .speaker { width: 40px !important; height: 40px !important; font-size: 20px !important; }
            .hearts, #score { font-size: 18px !important; }
            #clueImg { width: 50px !important; height: 50px !important; }
            .message-overlay { padding: 20px !important; width: 90% !important; }
            button { font-size: 18px !important; padding: 10px 20px !important; }
        }
        @media (max-height: 600px) and (orientation: landscape) {
            body { overflow-y: auto !important; }
            canvas { height: 100vh !important; }
            #ui { 
                flex-direction: row !important; 
                justify-content: space-evenly !important; 
                top: 2px !important; 
                padding: 0 10px !important;
            }
            .top-bar { width: auto !important; margin-bottom: 0 !important; gap: 15px !important; }
            .word-container { padding: 2px 10px !important; gap: 5px !important; }
            h1 { font-size: 1.2rem !important; }
            .speaker { width: 30px !important; height: 30px !important; font-size: 16px !important; }
            #clueImg { width: 30px !important; height: 30px !important; }
            .message-overlay { padding: 15px !important; transform: translate(-50%, -50%) scale(0.8) !important; }
            .message-overlay.show { transform: translate(-50%, -50%) scale(1) !important; }
            h2 { font-size: 1.5rem !important; margin: 5px 0 !important; }
            p { font-size: 0.9rem !important; margin: 5px 0 !important; }
            button { font-size: 16px !important; padding: 5px 15px !important; margin-top: 5px !important; }
        }

    </style>
</head>

        </div>
        <div class="word-container">

            <img id="clueImg" src="">
            <h1 id="targetWord" style="color:#0369a1"></h1>
        </div>
    </div>

        <button onclick="startGame()">Dive In!</button>
    </div>

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        
        const words = ["bone", "stove", "tape", "shape", "crane", "rope", "plane", "cape", "mane", "cane", "smoke"];
        const loadedImages = {};
        words.forEach(w => {
            loadedImages[w] = new Image();
            loadedImages[w].src = b64Assets[w];
        });

        let currentWord = "";
        let currentLetterIdx = 0;
        
        let player = { x: canvas.width/2, y: canvas.height/2, w: 120, h: 80, targetX: canvas.width/2, targetY: canvas.height/2 };
        let bubbles = [];
        let particles = [];
        let spawnTimer = 0;

        function speakWord() {
            if(!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(currentWord);
            utterance.lang = 'en-US'; utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }

        let audioCtx = null;
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(type === 'win') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function updatePlayer(x, y) {
            player.targetX = x - player.w/2;
            player.targetY = y - player.h/2;
            if(player.targetX < 0) player.targetX = 0;
            if(player.targetX > canvas.width - player.w) player.targetX = canvas.width - player.w;
            if(player.targetY < 100) player.targetY = 100;
            if(player.targetY > canvas.height - player.h) player.targetY = canvas.height - player.h;
        }

        window.addEventListener("mousemove", (e) => updatePlayer(e.clientX, e.clientY));
        window.addEventListener("touchmove", (e) => { e.preventDefault(); updatePlayer(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});

        function spawnBubble() {
            // Randomly choose the correct letter or a random wrong letter
            let neededLetter = currentWord[currentLetterIdx];
            let isCorrect = Math.random() < 0.4; // 40% chance to spawn the correct letter
            
            let letterToSpawn = neededLetter;
            if(!isCorrect) {
                const alphabet = "abcdefghijklmnopqrstuvwxyz";
                letterToSpawn = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
            
            bubbles.push({
                letter: letterToSpawn,
                x: Math.random() < 0.5 ? -50 : canvas.width + 50, // spawn left or right
                y: Math.random() * (canvas.height - 150) + 150,
                r: 30,
                speedX: (Math.random() * 2 + 1) * (Math.random() < 0.5 ? 1 : -1),
                speedY: (Math.random() - 0.5) * 1.5
            });
            
            // Fix direction to ensure they cross screen
            let b = bubbles[bubbles.length-1];
            if(b.x < 0) b.speedX = Math.abs(b.speedX);
            else b.speedX = -Math.abs(b.speedX);
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<20; i++) {
                particles.push({x:x, y:y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:30, color:color});
            }
        }

        function pickNewWord() {
            let nextWord = words[Math.floor(Math.random() * words.length)];
            if(nextWord === currentWord && words.length > 1) { pickNewWord(); return; }
            currentWord = nextWord;
            currentLetterIdx = 0;
            document.getElementById("clueImg").src = b64Assets[currentWord];
            bubbles = []; // clear screen for new word
            updateUI();
            speakWord();
        }

        function updateUI() {
            let display = "";
            for(let i=0; i<currentWord.length; i++) {
                if(i < currentLetterIdx) display += currentWord[i] + " ";
                else display += "_ ";
            }
            document.getElementById("targetWord").innerText = display;
            
            document.getElementById("score").innerText = "Score: " + score;
            let h = "";
            for(let i=0; i<lives; i++) h += "❤️";
            for(let i=lives; i<3; i++) h += "🖤";
            document.getElementById("heartsDisplay").innerText = h;
        }

        function loseLife() {
            lives--; playSound('wrong'); updateUI();
            if(lives <= 0) {
                isPlaying = false;
                document.getElementById("startScreen").classList.add("show");
                document.getElementById("startScreen").innerHTML = "<h2>Game Over</h2><p>Your Score: "+score+"</p><button onclick='location.reload()'>Restart</button>";
            }
        }

        window.startGame = function() { window.gameStarted = true; resize();
            document.getElementById("startScreen").classList.remove("show");
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            score = 0; lives = 3; bubbles = [];
            isPlaying = true;
            pickNewWord();
            requestAnimationFrame(loop);
        }

        function drawBubble(ctx, x, y, r, letter) {
            // Draw bubble
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
            
            // Draw highlight
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r*0.2, 0, Math.PI*2); ctx.fill();
            
            // Draw letter
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(letter.toUpperCase(), x, y);
        }

        function loop() {
            if(!isPlaying) return;
            
            // Lerp Player Movement
            player.x += (player.targetX - player.x) * 0.1;
            player.y += (player.targetY - player.y) * 0.1;

            // Background
            if(bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#0284c7"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            // Submarine Player
            if(subReady) {
                ctx.drawImage(subCanvas, player.x, player.y, player.w, player.h);
            } else {
                ctx.fillStyle = "#fbbf24"; ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            // Spawn bubbles
            spawnTimer++;
            if(spawnTimer > 40) { // Medium fast spawn
                spawnBubble();
                spawnTimer = 0;
            }

            // Draw and update bubbles
            for(let i=bubbles.length-1; i>=0; i--) {
                let b = bubbles[i];
                b.x += b.speedX;
                b.y += b.speedY;
                
                // Add slight vertical wobble
                b.y += Math.sin(Date.now() / 200 + b.x) * 1.5;
                
                drawBubble(ctx, b.x, b.y, b.r, b.letter);
                
                // Collision with submarine
                let distX = (player.x + player.w/2) - b.x;
                let distY = (player.y + player.h/2) - b.y;
                let dist = Math.hypot(distX, distY);
                
                if(dist < b.r + player.w/2 - 10) { // Submarine hitbox
                    if(b.letter === currentWord[currentLetterIdx]) {
                        playSound('pop'); createExplosion(b.x, b.y, "white");
                        currentLetterIdx++; updateUI();
                        if(currentLetterIdx >= currentWord.length) {
                            score += 20;
                            playSound('win');
                            setTimeout(pickNewWord, 800);
                        }
                    } else {
                        createExplosion(b.x, b.y, "#ef4444");
                        loseLife();
                    }
                    bubbles.splice(i, 1);
                    continue;
                }

                // Remove if off screen
                if(b.x > canvas.width + 100 || b.x < -100 || b.y < -100 || b.y > canvas.height + 100) {
                    bubbles.splice(i, 1);
                }
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 30;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0;
                if(p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
